name: Verify notes
on:
  pull_request:
  push:
    branches: [main, recovered]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notes_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://notes_test:test_only@127.0.0.1:5432/notes_test
      TEST_DATABASE_URL: postgresql://notes_test:test_only@127.0.0.1:5432/notes_test
      APP_ORIGIN: http://127.0.0.1:3000
      APP_REDIRECT_HOSTS: notes-alias.invalid
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify production HTTP boundaries
        run: |
          npm start > /tmp/notes-server.log 2>&1 &
          echo $! > /tmp/notes-server.pid
          trap 'kill $(cat /tmp/notes-server.pid) || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:3000/notes/projects
          NOTES_TEST_BASE_URL=http://127.0.0.1:3000 npm run test:http
